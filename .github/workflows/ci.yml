name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Sibling Janus repos are consumed by git URL and are PRIVATE until each is
  # market-ready. Cargo fetches them through the git CLI, which honours the
  # token rewrite below. Set the repository secret JANUS_GIT_TOKEN to a
  # fine-grained PAT (or GitHub App token) with read access to the siblings.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  JANUS_GIT_TOKEN: ${{ secrets.JANUS_GIT_TOKEN }}

jobs:
  host:
    name: host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Authorise private sibling fetches
        if: ${{ env.JANUS_GIT_TOKEN != '' }}
        shell: bash
        run: git config --global url."https://x-access-token:${JANUS_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p rusty_esp_video-esp --features std
      - run: cargo clippy -p rusty_esp_video-esp --all-targets --features std -- -D warnings

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authorise private sibling fetches
        if: ${{ env.JANUS_GIT_TOKEN != '' }}
        shell: bash
        run: git config --global url."https://x-access-token:${JANUS_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      # Licences, the no-C ban list, advisories and the git allow-list: the
      # posture deny.toml states, checked on every push rather than by hand.
      - run: cargo deny check

  no_std:
    name: no_std (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - riscv32imac-unknown-none-elf   # ESP32-C6 / C61 / H2 class
          - riscv32imafc-unknown-none-elf  # ESP32-P4 class
    steps:
      - uses: actions/checkout@v4
      - name: Authorise private sibling fetches
        if: ${{ env.JANUS_GIT_TOKEN != '' }}
        shell: bash
        run: git config --global url."https://x-access-token:${JANUS_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo check -p rusty_esp_video-core --no-default-features --target ${{ matrix.target }}
      - run: cargo check -p rusty_esp_video-core --no-default-features --features alloc --target ${{ matrix.target }}
      - run: cargo check -p rusty_esp_video-core --no-default-features --features alloc,h264 --target ${{ matrix.target }}
      - run: cargo check -p rusty_esp_video-core --no-default-features --features alloc,jpeg --target ${{ matrix.target }}

  # Track B on the S3 (Xtensa): the esp toolchain from espup, no ESP-IDF.
  firmware-xtensa:
    name: firmware (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - xiao-s3-sense-hal-page
    steps:
      - uses: actions/checkout@v4
      - name: Authorise private sibling fetches
        if: ${{ env.JANUS_GIT_TOKEN != '' }}
        shell: bash
        run: git config --global url."https://x-access-token:${JANUS_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32s3
          # ldproxy links an ESP-IDF app. This is bare metal and does not
          # need it; installing it would only cost time.
          ldproxy: false
      # `build-std = ["core", "alloc"]` in the firmware's .cargo/config.toml
      # needs rust-src, which the action above installs.
      - run: cargo build --release
        working-directory: firmware/${{ matrix.project }}
        env:
          # The network is compile-time and a build with none fails on
          # purpose; these are the census's placeholders, not a network.
          JANUS_WIFI_SSID: census
          JANUS_WIFI_PASS: census-pass
