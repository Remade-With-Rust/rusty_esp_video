[workspace]
resolver = "3"
members = ["crates/*"]
# Per-chip firmware examples are their own cargo projects: each needs its own
# target, linker script and (for Xtensa) toolchain. They are never workspace
# members. See firmware/README.md.
exclude = ["firmware/*"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Remade-With-Rust/rusty_esp_video"
homepage = "https://www.mata.network/"
authors = ["Remade With Rust"]
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
# Internal crates carry BOTH path and version so the set publishes to crates.io
# in lockstep (the rusty_time pattern).
rusty_esp_video-core = { path = "crates/rusty_esp_video-core", version = "0.1.2", default-features = false }
rusty_esp_video-esp = { path = "crates/rusty_esp_video-esp", version = "0.1.2", default-features = false }

# Siblings in the Janus family are consumed by PUBLISHED VERSION, which is
# what lets this repo deploy on its own. A git URL carrying a version
# requirement does the opposite: a git source offers exactly one version --
# whatever is on that branch today -- so the requirement stops resolving the
# moment the sibling releases a new minor, and a lockfile hides it until
# someone edits a manifest. Inside the Janus umbrella, `.cargo/config.toml`
# patches these to the sibling checkouts, so local edits are visible without
# a push.
rusty_esp_core = { version = "0.1", default-features = false }
rusty_esp_image-core = { version = "0.1", default-features = false }
rusty_esp_dsp-esp = { version = "0.1", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
