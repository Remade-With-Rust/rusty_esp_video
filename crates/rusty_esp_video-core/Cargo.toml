[package]
name = "rusty_esp_video-core"
description = "esp_video, esp_h264 and the CameraWebServer stream remade in Rust, the pure core: the VideoEncoder seam with a zero-copy JPEG passthrough, MJPEG-over-HTTP, RTP payloaders (RFC 6184 H.264, RFC 2435 JPEG), an MPEG-TS mux that ffmpeg and rff read, raw UDP framing and a pacer. no_std, forbid(unsafe), no drivers."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/rusty_esp_video-core"
keywords = ["esp32", "embedded", "no-std", "video", "mpeg-ts"]
categories = ["embedded", "no-std", "multimedia::video", "multimedia::encoding"]

[features]
default = ["std"]
# The feature ladder is the rusty_zstd one: `std` implies `alloc`; with neither,
# the crate is pure `core` and still builds on riscv32 bare metal. `alloc`
# adds the `Vec<u8>` sink and the test/host-side TS demuxer.
std = ["alloc", "rusty_esp_core/std", "rusty_esp_image-core/std", "rusty_h264?/std"]
alloc = ["rusty_esp_core/alloc", "rusty_esp_image-core/alloc"]
# The J5 encoder: `rusty_h264` 0.14 Constrained Baseline behind `VideoEncoder`:
# `alloc` is enough, `libm` carries the float math on a chip (and makes host
# and chip decisions bit-identical when `std` has it too).
h264 = ["alloc", "dep:rusty_h264", "rusty_h264/libm"]
# The software JPEG encoder behind `VideoEncoder` (`jpeg::SoftJpeg`) through
# the image package: rusty_jpeg 0.4, no_std + alloc.
jpeg = ["alloc", "rusty_esp_image-core/jpeg"]
# Run the ESP32-S3 PIE twin of the Annex-B start-code scan. Correctness is
# unchanged: the twin is gated byte-identical against `annexb::scan3`, which
# stays in the tree as the oracle, and off-chip the twin IS that scalar -- so
# this feature is safe to leave on in a host build or a host test.
pie-s3 = ["dep:rusty_esp_dsp-esp", "rusty_esp_dsp-esp/pie-s3"]

[dependencies]
rusty_esp_core = { workspace = true }
# The one planned Layer-1 edge: a VideoSource is an ImageSource plus an encoder.
rusty_esp_image-core = { workspace = true }
# Default features OFF: no allocator hijack, no SIMD, the portable scalar codec.
rusty_h264 = { version = "0.14", default-features = false, optional = true }
# The ESP32-S3 vector twins, for `annexb`'s start-code scan. Optional and
# off by default: only a firmware that wants them asks.
rusty_esp_dsp-esp = { workspace = true, optional = true }

[dev-dependencies]
# Oracles. rusty_h264 with default features OFF: no allocator hijack, the
# portable scalar codec — the house encoder makes the fixture, the house
# decoder proves the round trip.
# No `std` here: the `std` feature of this crate turns it on through
# `rusty_h264?/std`, and a dev-dependency feature would leak into the
# bare-metal check of the library.
rusty_h264 = { version = "0.14", default-features = false }
rusty_jpeg = { version = "0.4", default-features = false, features = ["std"] }

[lints]
workspace = true
